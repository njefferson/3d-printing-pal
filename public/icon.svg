<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="A print nozzle over three stacked layers">
  <!--
    THE ONE SOURCE. tools/render-icons.mjs writes public/icon.svg from this file
    alongside the four PNGs, and `--check` fails if the served copy has drifted.
    Edit here, never there.

    IT IS AN ICON AT FAVICON SIZE BEFORE IT IS ANYTHING ELSE, which is why it
    carries one shape and no frame. The machine drawn on the social card is a
    different drawing on purpose: a printer farm shrunk to a favicon is grey mush,
    and a mark that only works large is not a mark.

    WHAT REPLACED, AND WHY. The previous mark was a filament spool seen face-on: a
    dark hub with a light centre, inside a rounded body. That is the shape of a
    pupil, and read cold the icon was thread with an eye in it. The lesson is not
    "spools are bad" — it is that the session drawing a mark is the one party that
    cannot see its accidental reading, because it already knows what the shape is
    meant to be. Anything drawn here gets looked at cold, at the size it is met.
  -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="28%" r="86%">
      <stop offset="0%" stop-color="#2e2e2e"/>
      <stop offset="62%" stop-color="#232323"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- The nozzle: body and tapered tip, in the palette's `wanted` amber. -->
  <rect x="188" y="60" width="136" height="112" rx="18" fill="#f0c674"/>
  <path d="M206 172 L306 172 L280 250 L232 250 Z" fill="#f0c674"/>

  <!-- Three laid layers, widening downward, in the palette's `fun` green. The
       gap between tip and top layer is the print in progress; closing it would
       make the whole thing one solid mass at small sizes. -->
  <rect x="140" y="284" width="232" height="34" rx="10" fill="#8fd6a4"/>
  <rect x="112" y="330" width="288" height="34" rx="10" fill="#8fd6a4"/>
  <rect x="84"  y="376" width="344" height="34" rx="10" fill="#8fd6a4"/>
</svg>
