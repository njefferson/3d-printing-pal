name: Gates

# Every gate this repo is held to, in one place both a developer and CI invoke.
#
# IT RUNS ON EVERY BRANCH WORK ACTUALLY LANDS ON — `staging` is where candidates
# go, `main` is production, and `claude/**` stays because the harness keeps
# creating those. A workflow written `branches: [main]` in a repo whose work
# happens elsewhere never executes at all: the hub's own doctrine gate was written
# that way and had not run once. An unrun workflow and a missing workflow are the
# same artefact.
#
# THE SHARED GATES ARE THE HUB'S OWN COPIES, not forks of them. The hub is
# checked out SHA-pinned, with credentials not persisted, into an untracked path
# so a widened pattern binds this repo on its next push with nothing to drift.

on:
  push:
    branches: [main, staging, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The doctrine's canonical gates. Pinned to a commit that exists on the
      # hub's default branch: a cross-repo gate depends on the OTHER repo's
      # published history, not on anybody's working copy.
      #
      # ADDING A STEP THAT RUNS A HUB GATE MEANS MOVING THIS PIN IN THE SAME
      # COMMIT. The third-person step was added against a pin from before that
      # gate existed, so it could only ever say `Cannot find module` — and it
      # failed having been watched passing locally, where the hub clone is at its
      # own HEAD, which is the one place it proves nothing about CI. Every step
      # after it was SKIPPED, and Deploy is a separate workflow, so the candidate
      # deployed measured by three gates out of eighteen.
      - name: Check out the hub (canonical gates)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: njefferson/noahjefferson
          ref: 61a3f9a3408e7aa679a7400fc5daf662b41869f9
          path: .hub
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # `npm ci`, never `npm install`: ci installs exactly the lockfile.
      - name: Install
        run: npm ci

      # BEFORE ANY GATE THAT LAUNCHES A BROWSER, and four of them do: the
      # accessibility gate, the social card's contrast check, the data-safety walk
      # and the update walk. This sat further down once, after the social check
      # that needs it — which passed locally, where the sandbox already has a
      # browser at a fixed path, and failed on the runner, where it does not.
      # The failure then SKIPPED every gate after it, so the release went out
      # having been measured by almost none of them.
      - name: Install the browser the browser-driven gates need
        run: npx --no-install playwright-core install --with-deps chromium

      # ---------------------------------------------------------------- hub gates
      - name: Privacy — nothing personal about the owner lands in any repo
        run: node .hub/privacy-check.mjs --repo .

      # THE SECOND HALF OF THE SAME RULE. privacy-check.mjs anchors every pattern
      # on the owner's name or role, so a verbatim sentence of somebody's speech
      # carries neither and passes it. This holds the other half: every set-apart
      # quotation is declared, and a quotation of the owner is never declarable.
      - name: Every set-apart quotation says whose words it is
        if: ${{ !cancelled() }}
        run: node .hub/quote-check.mjs --repo .

      # THE SAME RULE'S THIRD HALF. privacy-check anchors on the owner's name and
      # quote-check finds set-apart quotations; neither can see ordinary prose that
      # refers to the owner in the third person. This repo had nine such lines with
      # both of those green.
      - name: Prose about the owner is written in the third person
        if: ${{ !cancelled() }}
        run: node .hub/third-person-check.mjs --repo .

      # --artefact, NEVER the plain check: that also asserts .git/hooks/pre-commit
      # is installed and current, which is a fact about ONE CLONE, and
      # actions/checkout leaves .git/hooks empty by definition. The plain spelling
      # can never hold on a runner. What CI can check is the tracked artefact
      # against what .branch-guard declares.
      - name: The commit guard is the one that was declared
        if: ${{ !cancelled() }}
        run: node .hub/branch-guard.mjs --repo . --artefact

      - name: Docs — no tables or grids anywhere the owner reads
        run: node .hub/docs-check.mjs .

      - name: npm hygiene
        run: node .hub/pin-check.mjs --repo .

      # SECURITY.md Part 1 has listed `npm audit` as a check that runs
      # automatically since it was written, and in this repo it ran nowhere at
      # all — found by going to verify the claim rather than by anything failing.
      #
      # IT MATTERS MORE HERE THAN THE DEPENDENCY COUNT SUGGESTS. The app ships
      # zero runtime dependencies; every package in this tree is a dev tool. That
      # is not a reason to care less — those tools execute on a runner beside a
      # live Cloudflare token, which is threat #2 in the hub's threat model, and
      # the deploy job is one workflow away.
      #
      # CI only, and declared in tools/gates-parity.mjs CI_ONLY: it needs the
      # network and npm's advisory database, while every gate in the local chain
      # runs offline. It can also go red with no commit, which is the point of it
      # and the wrong behaviour for a pre-push chain.
      - name: Dependencies — nothing known-vulnerable in the tree
        if: ${{ !cancelled() }}
        run: npm run --silent audit

      - name: PWA — a new version waits and the reader is told
        run: node .hub/pwa-check.mjs --repo .

      - name: Palette — the colour floors
        run: node .hub/palette-check.mjs palettes/3d-printing-pal.json

      - name: Text size — type follows the reader's setting
        run: node .hub/scripts/check-textsize.mjs public/styles.css public/index.html

      # ------------------------------------------------------------ this repo's
      # FIRST, because it is the one that says whether the rest of this list is
      # the rest of the list. The gates below are named steps rather than one
      # `npm run check`, so that a red run says WHICH gate — and the cost of that
      # is two lists with nothing holding them together. `shell` and `fromurl`
      # were written, planted red, and added only to the chain: both passed
      # locally and neither had ever run here.
      - name: Every gate runs both locally and here
        run: npm run --silent parity

      - name: Patch notes — one source, no drift
        run: npm run --silent notes:check

      - name: Patch notes — product copy, not correspondence
        run: npm run --silent voice

      - name: Interactions — every drag has a non-drag path
        run: npm run --silent interactions

      # The markup the app boots from, before any of it runs.
      - name: App shell — the served page is the one the app expects
        run: npm run --silent shell

      # Nine real model addresses, each with the name it must produce. No browser.
      - name: A pasted address becomes the right name
        run: npm run --silent fromurl

      # probe-standalone.html is generated from probe.html/css/js and committed. It
      # is the copy that runs from a DISK, where no policy applies and where nobody
      # would think to check it against anything — so a stale one would measure
      # something different from its source and never be found out.
      - name: The standalone probe has not drifted from its source
        run: npm run --silent probe

      # status.html and probe.html are served by this deploy and are not the app,
      # so nothing else here measures them: the a11y gate derives its surfaces from
      # index.html, and palette-check reads the palette file rather than either
      # stylesheet, both of which are hand copies of it. This also holds the probe's
      # widened policy to its own single path, above /*, and the standalone copy to
      # being served as an attachment.
      - name: The pages that are not the app — contrast, landmarks, policy, never cached
        run: npm run --silent pages

      # icon.svg at the root is the one source; public/icon.svg is generated from
      # it. This compares them and needs no browser, so unlike the render itself
      # it can run here. It does NOT prove the PNGs were re-rendered — but one
      # command writes both, so a stale served copy is the signature of a render
      # that never ran.
      - name: Icon — the served copy has not drifted from the source
        run: npm run --silent icons

      # The card is read at a third of its size over artwork, which is exactly
      # where "it looks fine" stops being evidence.
      - name: Social card — contrast measured, not eyeballed
        run: npm run --silent social

      - name: Accessibility
        run: npm run --silent a11y

      # The data-safety walk: export, wipe, import, compare — plus five broken
      # files that must each be refused before anything is touched.
      - name: Data safety — export restores identically, bad files are refused
        run: npm run --silent backup

      # Driven against genuinely different second and third service workers. A
      # mocked registration proves the mock works and nothing else.
      - name: Stale app and offline
        run: npm run --silent update

  # Workflow security is a maintained tool's job, not a bespoke gate's. zizmor is
  # installed from the HUB's canonical requirements file rather than a pin of our
  # own, so every app is audited by the same build and one Dependabot bump moves
  # all of them.
  security:
    name: Workflow security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the hub (canonical zizmor pin)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: njefferson/noahjefferson
          ref: 61a3f9a3408e7aa679a7400fc5daf662b41869f9
          path: .hub
          persist-credentials: false

      - name: Install zizmor, pinned by version and hash
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet --only-binary=:all: \
            --require-hashes -r .hub/.github/requirements-ci.txt

      # --strict-collection is not the default and is load-bearing: without it a
      # workflow with a YAML error is logged at WARN, SKIPPED, and the run still
      # exits 0 printing "No findings to report. Good job!" — so the file most
      # likely to be wrong is the one excused.
      - name: Audit the workflows
        run: "$RUNNER_TEMP/zizmor/bin/zizmor --offline --strict-collection .github/workflows/"
